<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Allenamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column; main tabs Palestra / Corsa / Cibo / Stats, sub-tabs inside; one card per exercise, run or meal */
:root {
  --bg: #EEF1EF;
  --card: #FFFFFF;
  --fg: #151917;
  --muted: #5F6A65;
  --line: #D5DCD8;
  --accent: #0E7C66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --gym: #0E7C66;
  --run: #6A4FE0;
  --food: #C4622D;
  --water: #2F8FD0;
  --ok: #2E7D4F;
  --err: #B3261E;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0F1312; --card: #182020; --fg: #E8EEEB; --muted: #94A39D; --line: #2A3532;
  --accent: #3CC4A3; --accent-ink: #062018; --accent-soft: #173A32;
  --gym: #3CC4A3; --run: #9B86FF; --food: #EE8A52; --water: #6FB2EA; --ok: #5FC48A; --err: #F2827A; color-scheme: dark } }

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 2rem; margin: 0; text-transform: uppercase; }
h2 { font-family: var(--display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
.date input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
.status { font-size: .8rem; color: var(--muted); min-height: 1.2em; margin-top: 4px; }
.status.err { color: var(--err); }
.sub { color: var(--muted); font-size: .85rem; font-weight: 400; }
.sub.warn { color: var(--err); }
.help { color: var(--muted); font-size: .85rem; margin: 0; }

nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 12px; }
nav button { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .03em; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.subnav { display: grid; gap: 6px; }
.subnav button { font: 600 .95rem var(--body); padding: 8px 0; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.subnav button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.ss { display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--accent); padding-left: 8px; }
.ss-label { font-family: var(--display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.card, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.done { border-color: var(--ok); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-name { font-weight: 600; font-size: 1.05rem; min-width: 0; }
.scheme { font-family: var(--display); font-size: 1.15rem; white-space: nowrap; background: var(--accent-soft); color: var(--fg); border-radius: 6px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.scheme.run { background: color-mix(in srgb, var(--run) 18%, transparent); }
.workout { display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--run); padding-left: 10px; }
.workout b { font-size: 1.05rem; }
.videos { display: flex; flex-wrap: wrap; gap: 6px; }
.videos a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 5px 12px; font-size: .9rem; font-weight: 600; }
.videos a svg { width: 14px; height: 14px; fill: currentColor; }
.log { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.log.log3 { grid-template-columns: 1fr 1fr 1fr; }
.log .wide { grid-column: 1 / -1; }
.log label { display: flex; flex-direction: column; gap: 3px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
.log input { font: 600 1.25rem/1.2 var(--display); letter-spacing: .04em; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; font-variant-numeric: tabular-nums; }
.prev { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prev b { color: var(--fg); font-weight: 600; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.center { text-align: center; flex: 1; min-width: 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }

.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.types button { font: 600 .95rem/1.15 var(--body); padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.types button small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.types button[aria-pressed="true"] { border-color: var(--food); box-shadow: inset 0 0 0 1px var(--food); background: color-mix(in srgb, var(--food) 14%, transparent); }
.time { font-family: var(--display); font-size: 1.1rem; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; font: 600 .9rem var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.items { display: flex; flex-direction: column; }
.item { border-top: 1px solid var(--line); padding-block: 8px; }
.item:first-child { border-top: 0; padding-top: 0; }
.item-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; }
button.item-row { cursor: pointer; }
.item-name { font-weight: 600; min-width: 0; }
.item-q { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.swap { font-size: .8rem; color: var(--food); font-weight: 600; }
.alts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.alts button { font: 500 .85rem var(--body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.alts button[aria-pressed="true"] { border-color: var(--food); font-weight: 600; }
.note { font-size: .85rem; color: var(--food); font-weight: 600; }
.water { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.glasses { display: flex; gap: 4px; flex-wrap: wrap; }
.glass { width: 22px; height: 28px; border: 2px solid var(--water); border-top: 0; border-radius: 0 0 6px 6px; background: transparent; padding: 0; cursor: pointer; }
.glass.on { background: var(--water); }
.water-n { font: 700 1.4rem var(--display); color: var(--water); font-variant-numeric: tabular-nums; }
.weigh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weigh input { font: 700 1.8rem/1.1 var(--display); width: 6.5rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.weigh .unit { font: 600 1.2rem var(--display); color: var(--muted); }
.shop h3 { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 0 2px; }
.shop label { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.shop input { width: 20px; height: 20px; accent-color: var(--food); }
.shop label.got span { text-decoration: line-through; color: var(--muted); }
.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }

.sect { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 10px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; border-top: 3px solid var(--line); }
.tile.t-gym { border-top-color: var(--gym); } .tile.t-run { border-top-color: var(--run); } .tile.t-food { border-top-color: var(--food); } .tile.t-water { border-top-color: var(--water); }
.tile .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .v { font: 700 1.7rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 17px var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .val { fill: var(--fg); font-weight: 600; }
.chart rect.c-gym { fill: var(--gym); } .chart rect.c-run { fill: var(--run); } .chart rect.c-food { fill: var(--food); } .chart rect.c-water { fill: var(--water); }
.chart.c-gym { --c: var(--gym); } .chart.c-run { --c: var(--run); } .chart.c-food { --c: var(--food); }
.chart .line { fill: none; stroke: var(--c); stroke-width: 2.5; }
.chart .dot { fill: var(--c); }
.chart .area { fill: var(--c); opacity: .14; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.legend i.c-gym { background: var(--gym); } .legend i.c-run { background: var(--run); }
.hbars { display: flex; flex-direction: column; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(0, 9rem) 1fr auto; gap: 8px; align-items: center; font-size: .9rem; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.hbar .fill { display: block; height: 100%; background: var(--food); border-radius: 5px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.muted { color: var(--muted); font-size: .85rem; }
.up { color: var(--accent); font-weight: 600; }
.tbl { overflow-x: auto; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 600 .95rem var(--body); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn.dirty::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-left: 6px; vertical-align: middle; }
.panel.demo { border-color: var(--accent); background: var(--accent-soft); }
#syncPanel { margin-top: 8px; }
@media (max-width: 380px) { nav button { font-size: 1rem; } .tile .v { font-size: 1.4rem; } .log.log3 { grid-template-columns: 1fr 1fr; } .types button { font-size: .85rem; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Allenamento</h1>
    <div class="head-actions">
      <label class="date">Giorno <input type="date" id="date"></label>
      <button class="btn ghost small" id="installBtn" hidden>Installa app</button>
      <button class="btn small" id="syncBtn">Sincronizza</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <section class="panel" id="syncPanel" hidden>
    <div class="panel-head"><h2>Sincronizza con il NAS</h2><button class="btn ghost small" id="syncClose">Chiudi</button></div>
    <div id="syncBody"></div>
    <div class="status" id="syncMsg"></div>
    <div class="sub" id="syncInfo"></div>
  </section>
  <nav role="tablist" id="tabs"></nav>
  <main class="list" id="list"></main>
</div>
<script>
const GYM = {
  lun: { name: "Lun", full: "Lunedì", items: [
    { id: "l-chestpress", n: "Chest press", s: "3×8", v: [["Chest press", "chest press machine esecuzione corretta"]] },
    { id: "l-chestfly", n: "Chest fly", s: "2×8", v: [["Chest fly", "chest fly machine pec deck esecuzione"]] },
    { id: "l-pushdips", n: "Push up + dips", s: "6/8 + max", v: [["Push up", "push up esecuzione corretta"], ["Dips", "dips parallele esecuzione corretta"]] },
    { id: "l-ohext", n: "Overhead extension", note: "tricipite", s: "3×8/10", v: [["Video", "overhead triceps extension cable"]] },
    { ss: [
      { id: "l-alzlat", n: "Alzate laterali", s: "3×10/12", v: [["Video", "alzate laterali manubri esecuzione corretta"]] },
      { id: "l-panca60", n: "Panca 60 alzate verticali", note: "gomito sotto spalla a 90°", s: "2×8", v: [["Video", "incline bench 60 degree dumbbell shoulder press"]] }
    ]},
    { id: "l-addome", n: "Addome isometrie", note: "tenuta 8 sec · 2,5 kg", s: "12 reps", v: [["Video", "weighted isometric crunch hold"]] },
    { id: "l-plank", n: "Plank + uovo", note: "prisoner v-ups", s: "10 reps", v: [["Plank", "plank esecuzione corretta"], ["Prisoner v-up", "prisoner v up abs exercise"]] }
  ]},
  mer: { name: "Mer", full: "Mercoledì", items: [
    { id: "m-stacco", n: "Stacco", note: "6 all'80%, poi 3×6", s: "6 + 3×6", v: [["Video", "stacco da terra esecuzione corretta"]] },
    { id: "m-legcurl", n: "Leg curl sdraiato", s: "3×8/10", v: [["Video", "lying leg curl machine form"]] },
    { id: "m-legpress", n: "Leg press piedi in alto", s: "3×10", v: [["Video", "leg press piedi alti glutei"]] },
    { ss: [
      { id: "m-lat", n: "Lat machine", s: "3×8", v: [["Video", "lat machine esecuzione corretta"]] },
      { id: "m-vrow", n: "V row", s: "3×8", v: [["Video", "seated cable row v grip form"]] }
    ]},
    { id: "m-curlcavo", n: "Curl cavo basso", s: "3×8", v: [["Video", "curl bicipiti cavo basso esecuzione"]] },
    { id: "m-panca30bic", n: "Panca 30 bicipiti", s: "3×8", v: [["Video", "incline dumbbell curl form"]] }
  ]},
  ven: { name: "Ven", full: "Venerdì", items: [
    { id: "v-panca30", n: "Panca 30 spinte in alto", s: "3×8", v: [["Video", "incline dumbbell press 30 degrees form"]] },
    { id: "v-chestfly", n: "Chest fly", s: "3×8", v: [["Video", "chest fly machine pec deck esecuzione"]] },
    { id: "v-military", n: "Military press", s: "3×10", v: [["Video", "military press bilanciere esecuzione corretta"]] },
    { id: "v-alzlat60", n: "Alzate laterali panca 60", s: "3×8", v: [["Video", "incline bench lateral raise"]] },
    { ss: [
      { id: "v-pushdown", n: "Push down", note: "tricipiti", s: "3×8", v: [["Video", "triceps pushdown cavo esecuzione"]] },
      { id: "v-french", n: "Tricipiti panca piana EZ", note: "french press", s: "3×8", v: [["Video", "french press bilanciere ez panca piana"]] }
    ]},
    { id: "v-hanging", n: "Hanging knee to chest", s: "2×max", v: [["Video", "hanging knee raise form"]] },
    { id: "v-plankobl", n: "Plank obliquo + barchetta", note: "45s + 30s, fino a 1 min", s: "tempo", v: [["Plank obliquo", "side plank esecuzione"], ["Barchetta", "hollow body hold esercizio"]] }
  ]},
  sab: { name: "Sab", full: "Sabato", items: [
    { id: "s-pressa", n: "Pressa piedi in basso / squat", note: "squat: 2×6/8 + 1×8/10", s: "3×8", v: [["Pressa", "leg press piedi bassi quadricipiti"], ["Squat", "squat bilanciere esecuzione corretta"]] },
    { id: "s-legext", n: "Leg extension", s: "4×8", v: [["Video", "leg extension esecuzione corretta"]] },
    { id: "s-bulgarian", n: "Bulgarian squat", s: "4×6", v: [["Video", "bulgarian split squat form"]] },
    { id: "s-pulley", n: "Pulley cavo / row T-bar", s: "3×8", v: [["Pulley", "pulley basso esecuzione corretta"], ["T-bar row", "t bar row form"]] },
    { id: "s-rematore", n: "Rematore bilanciere", note: "focus gran dorsale", s: "3×6+", v: [["Video", "rematore bilanciere gran dorsale"]] },
    { id: "s-trazioni", n: "Trazioni presa supina", note: "bicipiti", s: "max", v: [["Video", "chin up presa supina esecuzione"]] },
    { id: "s-curlhammer", n: "Curl to hammer curl", note: "3 sec in discesa", s: "4×8", v: [["Video", "curl to hammer curl"]] },
    { id: "s-addome", n: "Addome isometrie", note: "tenuta 8 sec · 2,5 kg", s: "12 reps", v: [["Video", "weighted isometric crunch hold"]] },
    { id: "s-plank", n: "Plank + uovo", note: "prisoner v-ups", s: "10 reps", v: [["Plank", "plank esecuzione corretta"], ["Prisoner v-up", "prisoner v up abs exercise"]] }
  ]}
};

const g = (s) => s.split("|").map((x) => { const i = x.lastIndexOf(" "); const m = x.match(/^(.*?)\s+(\d[\d,.]*\s*(?:g|cucchiai|cucchiaino|uova|banana|mela|pera|kiwi|pesca|arancia|mozzarella)|\d+\s*\w+)$/); return m ? [m[1], m[2]] : [x, ""]; });
const CEREALI40 = "Fiocchi d'avena 40 g|Muesli 40 g|Corn Flakes integrali 40 g|All-Bran 40 g|Granola 40 g";
const YOG5 = "Yogurt greco 5 cucchiai|Yogurt greco 0% grassi 150 g|Quark 150 g|Ricotta vaccina 150 g|Yogurt intero bianco 150 g";
const DOLCE = "Miele 1 cucchiaino|Marmellata 15 g|Sciroppo d'acero 10 g|Crema di nocciole 100% 10 g|Confettura di frutta 15 g";
const PROT = ["Petto di pollo 200 g", "Salmone 200 g", "Tonno al naturale 160 g", "Bistecca di manzo 200 g", "Merluzzo 250 g", "Orata 200 g", "Petto di tacchino 200 g"];
const protFirst = (n) => [PROT.find((p) => p.startsWith(n)), ...PROT.filter((p) => !p.startsWith(n))].join("|");
const VERD = (first) => { const v = ["Zucchine", "Melanzane", "Spinaci", "Broccoli", "Fagiolini", "Cavolfiore", "Lattuga"]; return [first, ...v.filter((x) => x !== first)].map((x) => x + " 200 g").join("|"); };
const OLIO = "Olio extravergine d'oliva 2 cucchiai";
const PANE = "Pane comune 40 g|Pane integrale 40 g|Pane di segale 40 g|Crackers 25 g|Gallette di riso 30 g|Grissini 30 g";
const PRIMO70 = "Pasta 70 g|Riso 70 g|Farro 70 g|Orzo perlato 70 g|Pasta integrale 70 g|Riso integrale 70 g|Gnocchi di patate 150 g";
const FRUTTA = "Banana 1 banana|Mela 1 mela|Pera 1 pera|Kiwi 2 kiwi|Pesca 1 pesca";

const FOOD = {
  riposo: { name: "Riposo", sub: "Non attività", full: "Giorno di NON attività", meals: [
    { id: "col", n: "Colazione", h: "07:00", items: [CEREALI40, YOG5, DOLCE] },
    { id: "pra", n: "Pranzo", h: "12:30", items: [protFirst("Petto di pollo"), VERD("Zucchine"), OLIO, PANE] },
    { id: "spu", n: "Spuntino pomeridiano", h: "16:30", items: [FRUTTA] },
    { id: "cen", n: "Cena", h: "20:00", note: "Primo + secondo + verdure", items: [PRIMO70,
      "Tonno al naturale 150 g|Petto di pollo 150 g|Merluzzo 200 g|Uova intere 3 uova|Fagioli borlotti 200 g|Bresaola 100 g|Mozzarella 1 mozzarella",

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function todayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDate(key) { const [, m, d] = key.split("-"); return d + "/" + m; }
function addDays(key, n) { const d = new Date(key + "T12:00"); d.setDate(d.getDate() + n); return todayKey(d); }
function weekday(key) { return new Date(key + "T12:00").getDay(); }
function weekStart(key) { return addDays(key, -((weekday(key) + 6) % 7)); }
function setStatus(t, err) { $("status").textContent = t; $("status").classList.toggle("err", !!err); }
function vids(list) { return `<div class="videos">${list.map(([l, q]) => `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${PLAY}${esc(l)}</a>`).join("")}</div>`; }
function kgNum(s) { const n = parseFloat(String(s || "").replace(",", ".")); return isFinite(n) ? n : null; }
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
// "886" -> [8,8,6]; "12 10 10" -> [12,10,10]; "121010" -> [12,10,10]
function parseReps(s) {
  s = String(s || "").trim();
  if (!s) return [];
  if (/[^0-9]/.test(s)) return s.split(/[^0-9]+/).filter(Boolean).map(Number);
  const out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === "1" && i + 1 < s.length && s.length > 1) { out.push(Number(s.slice(i, i + 2))); i++; }
    else out.push(Number(s[i]));
  }
  return out;
}
// "25:30" or "1:02:10" -> seconds
function parseTime(s) {
  const p = String(s || "").trim().replace(/[.,]/g, ":").split(":").map(Number);
  if (!p.length || p.some((x) => !isFinite(x))) return null;
  const sec = p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 60;
  return sec > 0 ? sec : null;
}
function fmtPace(sec) { if (!sec || !isFinite(sec)) return "–"; sec = Math.round(sec); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

function runWeekIndex(key) { return Math.floor((new Date(weekStart(key) + "T12:00") - new Date(runStart + "T12:00")) / (7 * 864e5)); }
function runPrev(sess, before) {

  return ks.length ? [ks[ks.length - 1], R[ks[ks.length - 1]]] : null;
}
function paceOf(e) { const sec = parseTime(e.time), km = kgNum(e.km); return sec && km ? sec / km : null; }
function runCard(sess, wk) {

      <label>Tempo totale<input id="time-${sess}" inputmode="numeric" autocomplete="off" placeholder="es. 27:30" value="${esc(cur.time || "")}"></label>
      <label>Fatica 1–10<input id="rpe-${sess}" inputmode="numeric" autocomplete="off" placeholder="es. 7" value="${esc(cur.rpe || "")}"></label>
      ${sess === "A" ? `<label class="wide">Ritmo della parte veloce (min/km, se lo sai)<input id="split-A" inputmode="numeric" autocomplete="off" placeholder="es. 4:45" value="${esc(cur.split || "")}"></label>` : ""}
    </div>
    <div class="prev" id="pace-${sess}">${cur.km && cur.time ? "Ritmo medio: <b>" + fmtPace(paceOf(cur)) + " /km</b>" : ""}</div>
    <div class="prev">${prev ? `Ultima volta (${fmtDate(prev[0])}): <b>${esc(prev[1].km || "–")} km</b> in <b>${esc(prev[1].time || "–")}</b>${paceOf(prev[1]) ? " · " + fmtPace(paceOf(prev[1])) + " /km" : ""}${prev[1].split ? " · parte veloce " + esc(prev[1].split) + " /km" : ""}` : "Nessuna seduta precedente"}</div>`;
  for (const f of ["km", "time", "rpe", "split"]) {

// ---------- Charts ----------
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;

// series: [{cls, label}] ; data: [{label, values:[..]}] stacked bars
function barChart(data, series, opts = {}) {
  const W = 600, H = 230, L = 58, R = 8, T = 22, B = 28;
  const totals = data.map((d) => d.values.reduce((a, b) => a + b, 0));
  const max = opts.max || Math.max(1, ...totals);
  const step = opts.step || niceStep(max / 3);
  const top = opts.max || Math.ceil(max / step) * step;
  const f = opts.fmt || fmtNum;
  const y = (v) => T + (H - T - B) * (1 - Math.min(v, top) / top);
  const bw = (W - L - R) / data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end">${f(v)}</text>`;
  const every = Math.ceil(data.length / 7);
  data.forEach((d, i) => {
    const x = L + i * bw + bw * 0.16, w = bw * 0.68;
    let acc = 0;
    d.values.forEach((v, j) => { if (v > 0) { s += `<rect class="${series[j].cls}" x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" rx="2"/>`; acc += v; } });
    if (i % every === 0 || i === data.length - 1) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
  });
  const lt = totals[totals.length - 1];
  if (lt > 0) s += `<text class="val" x="${L + (data.length - 1) * bw + bw / 2}" y="${y(lt) - 6}" text-anchor="middle">${f(lt)}</text>`;
  s += "</svg>";
  if (series.length > 1) s += `<div class="legend">${series.map((sr) => `<span><i class="${sr.cls}"></i>${esc(sr.label)}</span>`).join("")}</div>`;
  return s;
}
function lineChart(pts, unit, cls, fmtV) {
  const W = 600, H = 230, L = 58, R = 18, T = 26, B = 28;
  const f = fmtV || ((v) => String(Math.round(v * 10) / 10).replace(".", ","));
  let lo = Math.min(...pts.map((p) => p.value)), hi = Math.max(...pts.map((p) => p.value));
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (i) => pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart ${cls}" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end">${f(v)}</text>`;
  const line = pts.map((p, i) => `${x(i)},${y(p.value)}`).join(" ");
  if (pts.length > 1) s += `<polygon class="area" points="${x(0)},${y(lo)} ${line} ${x(pts.length - 1)},${y(lo)}"/><polyline class="line" points="${line}"/>`;
  const every = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    s += `<circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="${last ? 5 : 3}"/>`;
    if (i % every === 0 || last) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${p.label}</text>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text class="val" x="${x(pts.length - 1)}" y="${y(lp.value) - 10}" text-anchor="${pts.length > 1 ? "end" : "middle"}">${f(lp.value)} ${unit}</text>`;

      ${splits.length ? lineChart(splits, "/km", "c-run", fmtPace) : '<p class="empty">Segna il ritmo della parte veloce il martedì per vedere quanto migliori.</p>'}</section>
    ${paces.length > 1 ? `<section class="panel"><h2>Ritmo medio delle corse</h2><div class="sub">Se scende sugli stessi km, la resistenza sta migliorando</div>${lineChart(paces, "/km", "c-run", fmtPace)}</section>` : ""}
    <section class="panel"><h2>Volume palestra</h2><div class="sub">Ripetizioni × kg di tutti gli esercizi, per settimana</div>
      ${Object.keys(volBy).length ? barChart(weeks.map((w) => ({ label: fmtDate(w), values: [Math.round(volBy[w] || 0)] })), [{ cls: "c-gym", label: "Volume" }]) : '<p class="empty">Segna reps e kg nella scheda Palestra.</p>'}</section>
    <section class="panel"><div class="panel-head"><h2>Andamento esercizio</h2>
      ${rows.length ? `<select id="exsel" aria-label="Esercizio">${rows.map((r) => `<option value="${r.id}"${r.id === chartEx ? " selected" : ""}>${esc(GYM[GYM_EX[r.id].dayKey].name + " · " + GYM_EX[r.id].ex.n)}</option>`).join("")}</select>` : ""}</div>${exChart}</section>
    ${rows.length ? `<section class="panel"><h2>Record palestra</h2><div class="tbl"><table>
      <thead><tr><th>Esercizio</th><th class="num">Ultima</th><th class="num">Max kg</th><th class="num">Dall'inizio</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td>${esc(GYM_EX[r.id].ex.n)} <span class="sub">${GYM[GYM_EX[r.id].dayKey].name}</span></td><td class="num">${esc(r.lastE.r || "–")}${r.lastE.kg ? " · " + esc(r.lastE.kg) : ""}</td><td class="num">${r.best != null ? fmtNum(r.best) : "–"}</td><td class="num ${r.diff > 0 ? "up" : ""}">${r.diff > 0 ? "+" + fmtNum(r.diff) + " kg" : "–"}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <h3 class="sect">Corpo e alimentazione</h3>
    <section class="panel"><h2>Peso</h2>
      ${ws.length ? `<div class="sub">kg · ${ws.length > 1 ? "dall'inizio " + diffKg(lastW.v, ws[0].v) + " kg" : "prima pesata"}</div>${lineChart(ws.slice(-60).map((w) => ({ label: fmtDate(w.k), value: w.v })), "kg", "c-food")}` : '<p class="empty">Segna il peso in Cibo › Peso.</p>'}</section>
    <section class="panel"><h2>Pasti rispettati</h2><div class="sub">Ultimi 14 giorni</div>
      ${Object.keys(DD).length ? barChart(Array.from({ length: 14 }, (_, i) => addDays(today, i - 13)).map((k) => ({ label: fmtDate(k), values: [pct(k) || 0] })), [{ cls: "c-food", label: "%" }], { max: 100, step: 50, fmt: (v) => Math.round(v) + "%" }) : '<p class="empty">Segna i pasti come fatti in Cibo › Pasti.</p>'}</section>
    <section class="panel"><h2>Acqua</h2><div class="sub">Litri al giorno, ultimi 14 giorni · obiettivo 2–2,5 L</div>
      ${Object.values(DD).some((d) => d.water) ? barChart(Array.from({ length: 14 }, (_, i) => addDays(today, i - 13)).map((k) => ({ label: fmtDate(k), values: [DD[k] ? (DD[k].water || 0) * 0.25 : 0] })), [{ cls: "c-water", label: "L" }], { max: 3, step: 1, fmt: (v) => v + " L" }) : '<p class="empty">Tocca i bicchieri in Cibo › Pasti.</p>'}</section>
    <section class="panel"><h2>Rotazione cibi</h2><div class="sub">Proteine e primi mangiati negli ultimi 14 giorni. Il piano chiede di variare.</div>
      ${top.length ? `<div class="hbars">${top.map(([n, c]) => `<div class="hbar"><span class="name">${esc(n)}</span><span class="track"><span class="fill" style="width:${Math.round(100 * c / topMax)}%"></span></span><span>${c}×</span></div>`).join("")}</div>` : '<p class="empty">Scegli le alternative nei pasti e segnali come fatti.</p>'}</section>
    ${demo ? "" : `<section class="panel"><h2>Simulazione</h2><div class="sub">Guarda come saranno le statistiche con dati di esempio. Niente viene salvato.</div>${demoBtns}</section>`}`;
  $("list").querySelectorAll("[data-demo]").forEach((b) => b.onclick = () => startDemo(+b.dataset.demo));
  if (demo) $("demoStop").onclick = () => { demo = null; chartEx = null; renderStats(); };
  const sel = $("exsel");
  if (sel) sel.onchange = () => { chartEx = sel.value; renderStats(); };
}

// ---------- Sincronizzazione con il file sul NAS ----------
// Un solo file con tutto. Ogni voce ha t (ora della modifica): quando si unisce vince la più recente.
const FILE = "allenamento-dati.json";
function mergeGym(inc) {
  let n = 0;
  for (const [id, h] of Object.entries(inc || {})) {
    if (!GYM_EX[id] || !h || typeof h !== "object") continue;
    G[id] = G[id] || {};
    for (const [k, e] of Object.entries(h)) {
      if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      if (!G[id][k] || (e.t || 0) > (G[id][k].t || 0)) { G[id][k] = { r: String(e.r || ""), kg: String(e.kg || ""), t: Number(e.t) || 0 }; n++; }
    }
  }
  return n;
}
function mergeRun(inc) {
  let n = 0;
  for (const [k, e] of Object.entries(inc || {})) {
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(k) || !RUN[e.s] && e.s !== "X") continue;
    if (!R[k] || (e.t || 0) > (R[k].t || 0)) { R[k] = { s: e.s, km: String(e.km || ""), time: String(e.time || ""), split: String(e.split || ""), rpe: String(e.rpe || ""), t: Number(e.t) || 0 }; n++; }
  }
  return n;
}
function mergeDiet(inc) {
  let n = 0;
  for (const [k, d] of Object.entries(inc || {})) {
    if (!d || typeof d !== "object" || !/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    if (!D[k] || (d.t || 0) > (D[k].t || 0)) {
      const c = { meals: d.meals || {}, water: Number(d.water) || 0, t: Number(d.t) || 0 };
      if (FOOD[d.type]) c.type = d.type;
      if (d.kg) c.kg = Number(d.kg);
      D[k] = c; n++;
    }
  }
  return n;
}
// accepts the new file and the two old ones (palestra-dati.json, dieta-dati.json)
function mergeFile(text) {
  const f = JSON.parse(text);
  if (f && f.app === "allenamento") return mergeGym(f.gym) + mergeRun(f.run) + mergeDiet(f.diet);
  if (f && f.app === "scheda-palestra") return mergeGym(f.logs);
  if (f && f.app === "piano-alimentare") return mergeDiet(f.days);
  throw new Error("bad_file");
}
function fileJson() { return JSON.stringify({ app: "allenamento", v: 1, savedAt: new Date().toISOString(), gym: G, run: R, diet: D }); }

function syncMeta() { try { return JSON.parse(localStorage.getItem(K.meta) || "{}"); } catch (e) { return {}; } }
function markSynced() { try { localStorage.setItem(K.meta, JSON.stringify({ last: Date.now() })); } catch (e) {} refreshSyncInfo(); }
function unsynced() {
  const last = syncMeta().last || 0;
  let n = 0;
  for (const h of Object.values(G)) for (const e of Object.values(h)) if ((e.t || 0) > last) n++;
  for (const e of Object.values(R)) if ((e.t || 0) > last) n++;
  for (const e of Object.values(D)) if ((e.t || 0) > last) n++;
  return n;
}
function fmtStamp(ms) { const d = new Date(ms); return fmtDate(todayKey(d)) + " alle " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
const canPickFile = typeof window.showSaveFilePicker === "function";
function idb(op, val) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("allenamento", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const st = r.result.transaction("kv", op === "get" ? "readonly" : "readwrite").objectStore("kv"); const q = op === "get" ? st.get("file") : st.put(val, "file"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); };
  });
}
async function syncFile(choose) {
  let h = choose ? null : await idb("get").catch(() => null);
  if (!h) { h = await window.showSaveFilePicker({ suggestedName: FILE, types: [{ description: "Dati allenamento", accept: { "application/json": [".json"] } }] }); await idb("put", h).catch(() => {}); }
  if ((await h.queryPermission({ mode: "readwrite" })) !== "granted" && (await h.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("no_permission");
  const text = await (await h.getFile()).text();
  const n = text.trim() ? mergeFile(text) : 0;
  persist();
  const w = await h.createWritable(); await w.write(fileJson()); await w.close();
  return n;
}
function syncMsg(t, err) { $("syncMsg").textContent = t; $("syncMsg").classList.toggle("err", !!err); }
function refreshSyncInfo() {
  const last = syncMeta().last, n = unsynced();
  $("syncInfo").textContent = (last ? "Ultima sincronizzazione: " + fmtStamp(last) + ". " : "Mai sincronizzato. ") + (n ? n + (n === 1 ? " modifica da sincronizzare." : " modifiche da sincronizzare.") : "Tutto sincronizzato.");
  $("syncBtn").classList.toggle("dirty", n > 0);
}
function renderSync() {
  $("syncBody").innerHTML = `
    ${canPickFile ? `<p class="sub">Legge il file dei dati, unisce con quelli di questo dispositivo e lo aggiorna. Un solo file per palestra, corsa e alimentazione.</p>
    <div class="btns"><button class="btn" id="syncGo">Sincronizza ora</button><button class="btn ghost" id="syncPick">Scegli un altro file</button></div>
    <p class="sub">La prima volta scegli dove tenere <b>${FILE}</b>: sul PC la cartella <b>DRIVE › App palestra</b> del NAS, sul telefono <b>Download</b> (poi lo copi sul NAS con CX File Explorer). Se il file esiste già conferma "Sostituisci": prima viene letto e unito.</p>` : `<p class="sub">Questo browser non può aprire file direttamente: usa Chrome.</p>`}
    <div class="btns"><button class="btn ghost small" id="importOld">Importa un file vecchio</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p class="sub">Per unire i dati dei file delle app precedenti (palestra-dati.json o dieta-dati.json), per esempio quelli del PC.</p>`;
  if (canPickFile) {
    const run = async (choose) => {
      syncMsg("Sincronizzazione…");
      try { const n = await syncFile(choose); markSynced(); render(); syncMsg("Fatto ✓ " + (n ? n + " dati nuovi presi dal file." : "Il file è aggiornato.")); }
      catch (e) {
        if (e && e.name === "AbortError") return syncMsg("Annullato.");
        if (e && e.message === "bad_file") return syncMsg("Quel file non è " + FILE + ". Scegli quello giusto con \"Scegli un altro file\".", true);
        syncMsg("Non riesco a raggiungere il file. Sei a casa e il NAS è collegato? Riprova o sceglilo di nuovo.", true);
      }
    };
    $("syncGo").onclick = () => run(false);
    $("syncPick").onclick = () => run(true);
  }
  $("importOld").onclick = () => $("importFile").click();
  $("importFile").onchange = async (ev) => {
    const f = ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    try { const n = mergeFile(await f.text()); persist(); render(); refreshSyncInfo(); syncMsg("Importato ✓ " + n + " dati nuovi."); }
    catch (e) { syncMsg("Questo file non contiene dati delle app (palestra, dieta o allenamento).", true); }
  };
}
$("syncBtn").onclick = () => { const p = $("syncPanel"); p.hidden = !p.hidden; if (!p.hidden) { renderSync(); syncMsg(""); refreshSyncInfo(); } };
$("syncClose").onclick = () => { $("syncPanel").hidden = true; };

// ---------- Data, nuovo giorno, installazione ----------
dateEl.addEventListener("change", () => {
  if (!dateEl.value) dateEl.value = todayKey();
  if (GYM_WD[weekday(dateEl.value)]) gymDay = GYM_WD[weekday(dateEl.value)];
  runWeekOffset = 0;
  render();
});
let shownToday = todayKey();
function checkNewDay() {
  const now = todayKey();
  if (now === shownToday) return;
  const wasToday = dateEl.value === shownToday;
  shownToday = now;
  if (!wasToday) return;
  dateEl.value = now;
  tab = defaults(now); runWeekOffset = 0; demo = null;
  renderTabs(); render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
window.addEventListener("focus", checkNewDay);
setInterval(checkNewDay, 60000);

let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").hidden = true; };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

renderTabs();
render();
refreshSyncInfo();
setStatus("Pronto. I dati si salvano sul dispositivo.");

</script>
